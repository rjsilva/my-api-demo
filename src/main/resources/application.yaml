spring:
  application:
    name: demo-ia-spec
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tasks}
    username: ${DB_USERNAME:tasks}
    password: ${DB_PASSWORD:tasks}
    hikari:
      # FR-010: keep trying to reach the database for up to 30 s at startup, then fail.
      initialization-fail-timeout: 30000
      # FR-009: fail fast (→ 503) instead of waiting the default 30 s for a connection.
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # Shows each component's status (e.g. db: UP/DOWN) without exposing details.
      show-components: always
