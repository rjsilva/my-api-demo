spring:
  application:
    name: demo-ia-spec
  main:
    # stdout carries only structured JSON log lines (FR-002).
    banner-mode: off
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tasks}
    username: ${DB_USERNAME:tasks}
    password: ${DB_PASSWORD:tasks}
    hikari:
      # FR-010: keep trying to reach the database for up to 30 s at startup, then fail.
      initialization-fail-timeout: 30000
      # FR-009: fail fast (→ 503) instead of waiting the default 30 s for a connection.
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  error:
    # Defense in depth for Boot's /error fallback: never expose internals (FR-013).
    include-stacktrace: never
    include-message: never

logging:
  structured:
    format:
      # One JSON object per line, Elastic Common Schema (FR-002).
      console: ecs
    json:
      # Same snake_case style as request_id.
      rename:
        traceId: trace_id
        spanId: span_id
  level:
    # FR-018: level adjustable without code changes.
    root: ${LOG_LEVEL:INFO}

# JDBC spans (datasource-micrometer): never capture parameter values nor log SQL (FR-011/012).
jdbc:
  datasource-proxy:
    include-parameter-values: false
    query:
      enable-logging: false

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  # OTLP collector (grafana/otel-lgtm) is an external dependency (Constitution VII): explicit
  # timeouts; export is batched/asynchronous and failures only drop telemetry (FR-015).
  # Endpoints come from spring-boot-docker-compose in dev, or the *.otlp.endpoint properties.
  opentelemetry:
    logging:
      export:
        otlp:
          timeout: ${OTLP_EXPORT_TIMEOUT:5s}
          connect-timeout: ${OTLP_CONNECT_TIMEOUT:2s}
    tracing:
      export:
        otlp:
          timeout: ${OTLP_EXPORT_TIMEOUT:5s}
          connect-timeout: ${OTLP_CONNECT_TIMEOUT:2s}
  otlp:
    metrics:
      export:
        step: ${OTLP_METRICS_STEP:15s}
        connect-timeout: ${OTLP_CONNECT_TIMEOUT:2s}
        read-timeout: ${OTLP_EXPORT_TIMEOUT:5s}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # Shows each component's status (e.g. db: UP/DOWN) without exposing details.
      show-components: always
